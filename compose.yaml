services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ledgo
      POSTGRES_PASSWORD: ledgo
      POSTGRES_DB: ledgo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ledgo"]
      interval: 1s
      retries: 30
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ledgo
      APP_USER: ledgo
      APP_USER_PASSWORD: ledgo
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 2s
      retries: 90
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ledgo
      MYSQL_USER: ledgo
      MYSQL_PASSWORD: ledgo
      MYSQL_DATABASE: ledgo
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uledgo", "-pledgo"]
      interval: 1s
      retries: 60
